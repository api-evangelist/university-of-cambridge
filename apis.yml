  name: iDiscover library discovery (Ex Libris Primo VE) — TENANT
  description: >-
    Cambridge's library discovery layer runs on Ex Libris Primo VE. idiscover.lib.cam.ac.uk is a
    CNAME to cam.primo.exlibrisgroup.com -> eu00.primo.exlibrisgroup.com, and the landing URL
    redirects to /discovery/search?vid=44CAM_INST:44CAM_PROD — an Ex Libris tenant view identifier,
