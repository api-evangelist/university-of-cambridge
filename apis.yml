x-coverage:
  state: covered
  reason: institution_operated_surfaces_verified
  detail: >-
    Cambridge is one of the minority of institutions with a genuine, in-house programmable
    footprint, and every surface recorded here resolved on a cam.ac.uk host under University
    Information Services. Ten institution-operated surfaces were verified live on 2026-08-19: the
    Lookup/Ibis first-party OpenAPI 3.0 (39 paths, byte-identical to the copy stored in this repo),
    the API Gateway developer portal listing ten published APIs, a live OpenID Connect discovery
    document, Shibboleth SAML 2.0 IdP metadata, the Apollo DSpace 8.1 REST root, the Apollo OAI-PMH
    endpoint with eleven metadata formats, and the Cambridge Digital Library IIIF Presentation and
    Image APIs. Coverage is not total: only the Lookup contract is downloadable as a
    machine-readable spec, so nine of the ten gateway APIs are documented but uncontracted here;
    the gateway itself answers 401 without registered client credentials; the portal's
    /openapi.json path returns an Angular SPA shell rather than a spec and was rejected as a
    soft-200; and no public status page exists for the platform. Two vendor platforms running under
    Cambridge subdomains — iDiscover (Ex Libris Primo VE) and Elements (Symplectic) — are recorded
    as tenant relationships and were deliberately not saved as Cambridge contracts.
  evidence:
