- aid: university-of-cambridge:shibboleth-idp
  x-operator: institution
  name: Cambridge Shibboleth Identity Provider (SAML 2.0 metadata)
  description: >-
    The University's Shibboleth identity provider, publishing signed SAML 2.0 IdP metadata at
    https://shib.raven.cam.ac.uk/shibboleth. The EntityDescriptor carries entityID
    https://shib.raven.cam.ac.uk/shibboleth, an IDPSSODescriptor advertising SAML 2.0, SAML 1.1
    and Shibboleth 1.0, authoritative shibmd:Scope values of cam.ac.uk and
    eresources.lib.cam.ac.uk, an mdui:DisplayName of "University of Cambridge", and mdui:DiscoHints
    listing Cambridge's own IP ranges (128.232.0.0/16, 129.169.0.0/16, 131.111.0.0/16 and others).
    This is federation metadata a university operates by definition and cannot outsource — it is
    the surface class most institutional profiles miss entirely. Cambridge participates in the UK
    Access Management Federation, which republishes this entity through eduGAIN.
  humanURL: https://docs.raven.cam.ac.uk/en/latest/
  baseURL: https://shib.raven.cam.ac.uk/shibboleth
