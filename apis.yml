aid: university-of-cambridge
name: University of Cambridge
description: >-
  The University of Cambridge (founded 1209) is a public collegiate research
  university and Russell Group member whose programmable footprint is unusually
  real for a university, and is operated in-house by University Information
  Services (UIS) rather than bought in. Verified institution-operated surfaces:
  the Lookup/Ibis directory web service, which publishes a first-party OpenAPI
  3.0 document at www.lookup.cam.ac.uk/openapi-3.0.yaml (39 paths, byte-identical
  to the copy held here); an API Gateway on the University's own domain
  (api.apps.cam.ac.uk) whose developer portal lists ten published APIs — Lookup,
  University Card, University Photo, University Student, University Human
  Resources, OAuth2, Raven device statistics, Institutional identifier mapping,
  Undergraduate Admissions and Staff On Costs — fronted by a live OpenID Connect
  discovery document; a Shibboleth SAML 2.0 identity provider publishing signed
  IdP metadata; the Apollo institutional repository, self-hosted DSpace 8.1 on
  Cambridge IP space with a DSpace REST API and an OAI-PMH endpoint serving
  eleven metadata formats and minting DataCite DOIs under prefix 10.17863; and
  the Cambridge Digital Library IIIF Presentation and Image APIs. Honest limits:
  only the Lookup contract is published as a downloadable machine-readable spec,
  every gateway API requires registered client credentials before it will answer,
  and there is no public status page for the API platform. Library discovery
  (iDiscover, Ex Libris Primo VE) and the research information system (Symplectic
  Elements) run under Cambridge subdomains but are vendor platforms — they are
  recorded here as tenant relationships, not as Cambridge contracts.
