generated: '2026-08-19'
method: probed
source: >-
  Live probes of University of Cambridge hosts on 2026-08-19 — shib.raven.cam.ac.uk,
  api.repository.cam.ac.uk, api.apps.cam.ac.uk, www.lookup.cam.ac.uk, cudl.lib.cam.ac.uk,
  images.lib.cam.ac.uk — plus the DataCite REST API for DOI prefix attribution.
regime: education
regime_name: Education & Research
note: >-
  Conformance against the Kin Score `education` regime standards list. Reward-only: a standard is
  recorded here only where a live response, not a prose claim, demonstrated it. Absent standards
  are recorded as conforms:false with the negative evidence that established the absence, so a
  later run does not have to re-probe them blind. Every conformance below belongs to an
  x-operator:institution surface; nothing here is credited from a tenant or vendor platform.
standards:
- id: oai-pmh
  conforms: true
  evidence: >-
    https://api.repository.cam.ac.uk/server/oai/request?verb=Identify returns HTTP 200 and a valid
    OAI-PMH 2.0 envelope — protocolVersion 2.0, repositoryName "Apollo - University of Cambridge
    Repository", baseURL https://api.repository.cam.ac.uk/server/oai/request, repositoryIdentifier
    www.repository.cam.ac.uk, adminEmail support@repository.cam.ac.uk, earliestDatestamp
    1959-01-01T00:00:00Z, granularity YYYY-MM-DDThh:mm:ssZ, deletedRecord transient. ListMetadataFormats
    returns eleven prefixes (oai_dc, qdc, mods, mets, marc, didl, ore, rdf, etdms, uketd_dc, rioxx);
    ListSets returns 100+ sets; ListRecords with metadataPrefix=rioxx returns live records.
- id: shibboleth
  conforms: true
  evidence: >-
    https://shib.raven.cam.ac.uk/shibboleth returns HTTP 200 and a Shibboleth IdP EntityDescriptor
    with an IDPSSODescriptor whose protocolSupportEnumeration includes urn:mace:shibboleth:1.0, and
    shibmd:Scope elements (urn:mace:shibboleth:metadata:1.0) asserting authority over cam.ac.uk and
    eresources.lib.cam.ac.uk.
- id: saml
  conforms: true
  evidence: >-
    The same EntityDescriptor is SAML 2.0 metadata (xmlns urn:oasis:names:tc:SAML:2.0:metadata),
    entityID https://shib.raven.cam.ac.uk/shibboleth, protocolSupportEnumeration
    "urn:oasis:names:tc:SAML:2.0:protocol urn:oasis:names:tc:SAML:1.1:protocol", with mdui:UIInfo
    DisplayName "University of Cambridge" and mdui:DiscoHints IPHints for Cambridge's own ranges.
- id: datacite
  conforms: true
  evidence: >-
    Apollo mints DataCite DOIs. https://api.datacite.org/prefixes/10.17863 returns HTTP 200 and
    resolves the prefix to DataCite client "bl.cam", whose client record names it "Apollo" with url
    https://www.repository.cam.ac.uk/ (registered 2015). Live Apollo OAI-PMH rioxx records carry
    DOIs of the form 10.17863/CAM.75329, 10.17863/CAM.80707, 10.17863/CAM.48716.
- id: orcid
  conforms: false
  evidence: >-
    No ORCID identifier appeared in Apollo's OAI-PMH qdc or rioxx output, and the DSpace REST
    /server/api/core/items collection answers HTTP 401 to anonymous callers, so no ORCID field
    could be confirmed on a public record. Recorded as absent rather than assumed — Symplectic
    Elements (a tenant surface) is the more likely ORCID integration point and its contract is not
    Cambridge's.
- id: crossref
  conforms: false
  evidence: >-
    Apollo's DOI prefix 10.17863 is a DataCite prefix, not a Crossref one; no Crossref deposit
    surface was found on any cam.ac.uk host.
- id: scim
  conforms: false
  evidence: >-
    The Lookup/Ibis OpenAPI (https://www.lookup.cam.ac.uk/openapi-3.0.yaml, 39 paths) models
    people, institutions and groups with a Cambridge-native vocabulary (CRSid, schemeid, fetch
    parameters), not RFC 7643/7644 SCIM resources; no /scim/v2 path exists on lookup.cam.ac.uk or
    api.apps.cam.ac.uk.
- id: lti
  conforms: false
  evidence: >-
    No LTI 1.3 platform or tool surface was found on a cam.ac.uk host; the University's VLE
    integrations were not exposed on any institution-operated endpoint probed.
- id: oneroster
  conforms: false
  evidence: No OneRoster endpoint found; the gateway's student surface is the CamSIS-sourced University Student API.
- id: ed-fi
  conforms: false
  evidence: Ed-Fi is a US K-12/state-longitudinal standard with no UK higher-education footprint; nothing found.
- id: caliper
  conforms: false
  evidence: No IMS Caliper Analytics sensor or event store found on any institution-operated host.
- id: qti
  conforms: false
  evidence: No QTI assessment surface found on any institution-operated host.
