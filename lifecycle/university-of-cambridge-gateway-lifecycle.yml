  https://developer.api.apps.cam.ac.uk/portals/api/sites/api-prod-a3dc87f7-prod/liveportal/apis —
  the live API catalogue served by the University's own developer portal (HTTP 200,
  application/json), read on 2026-08-19. Version/maturity labels cross-read from the portal
  descriptions and from the gateway's own path versions.
x-operator: institution
note: >-
  The University Information Services API Gateway publishes ten APIs on api.apps.cam.ac.uk. Only
  the Lookup contract is downloadable as a machine-readable spec (see openapi/); the other nine are
  documented on the portal but their OpenAPI snapshots are not retrievable anonymously — the
  portal's Apigee snapshot endpoint answers 405 to GET and its /apidocs/{id} route answers 401.
  Recording them here keeps the real footprint visible without fabricating contracts for them.
  Note the modification timestamps: six of the ten have not been touched since 2021-2022, which is
  consistent with the portal's own ALPHA labelling.
